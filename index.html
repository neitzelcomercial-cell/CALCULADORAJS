
<!DOCTYPE html>

<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Teste</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div id="contador">

        CONTADOR
        <br>

        <button class="conta" id="soma">+1</button>

        <button class="conta" id="subtrai">-1</button>

        <button class="conta" id="zera">Zerar</button>

        <br>

        <label for="resultado">Resultado:</label>

        <input
            type="number"
            id="resultado"
            placeholder="resultado"
            value="0"
        >

    </div>


    <div class="calculadora">

        <h3>CALCULADORA</h3>

        <div id="funcoes">

            <div id="numero">

                TECLADO
                <br>
                <br>

                <button class="num" id="1">1</button>
                <button class="num" id="2">2</button>
                <button class="num" id="3">3</button>
                <button class="num" id="4">4</button>
                <button class="num" id="5">5</button>

                <br>

                <button class="num" id="6">6</button>
                <button class="num" id="7">7</button>
                <button class="num" id="8">8</button>
                <button class="num" id="9">9</button>
                <button class="num" id="0">0</button>

            </div>


            <button id="div" class="func">/</button>

            <button id="mul" class="func">*</button>

            <button id="som" class="func">+</button>

            <button id="dim" class="func">-</button>

            <button id="zer" class="func">zerar</button>

        </div>


        <div class="rrr">

            <div id="escritas">

                <input
                    class="escr"
                    type="number"
                    id="a"
                    placeholder="ESCREVA AQUI 1"
                >

                <input
                    type="number"
                    id="b"
                    class="escr"
                    placeholder="ESCREVA AQUI 2"
                >

                <label for="visor" class="escr">
                    Resultado:
                </label>

                <input
                    type="number"
                    id="visor"
                    class="escr"
                    placeholder="RESULTADO FINAL !"
                >

            </div>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
